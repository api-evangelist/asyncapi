  organization (github.com/asyncapi) under the @asyncapi npm scope or the
  github.com/asyncapi Go module path, so all are official: true. Third-party
  libraries that carry "asyncapi" in the name (PyPI `asyncapi` by Diogo Dutra,
  crates.io `asyncapi`, com.asyncapi Java bindings) are deliberately NOT listed
  here: they are community work, not Initiative releases. `version` and
  `published` were read from each registry's metadata endpoint on 2026-09-06.
