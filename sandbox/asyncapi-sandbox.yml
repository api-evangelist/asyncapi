    kind: console
    url: https://studio.asyncapi.com
    auth: none
    http_status: 200
    checked: '2026-09-06'
    detail: >-
      Browser editor and visualiser for AsyncAPI documents with live validation,
      template preview and conversion. Nothing to install and nothing to sign up for.
  - name: AsyncAPI Studio (local)
    kind: console
    install: asyncapi start studio [SPEC-FILE]
    detail: Runs the same Studio locally against a file on disk.
  - name: Studio preview (minimal)
    kind: console
    install: asyncapi start preview SPEC-FILE
  - name: Server API interactive reference
    kind: reference
    url: https://api.asyncapi.com/v1/docs
