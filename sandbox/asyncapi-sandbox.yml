note: >-
  There is no test-vs-live separation to capture, because there is no live/paid
  mode: the production API is itself free, keyless and side-effect free, so every
  call is already a safe rehearsal. What AsyncAPI does publish is a hosted
  console and a local one, which is what the console_or_sandbox check is actually
  asking about. No test credentials, cards or magic values exist to record, and
  none were invented.
