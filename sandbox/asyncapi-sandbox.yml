  - name: Self-hosted Server API
    kind: sandbox
    install: docker run -it -p 80:80 asyncapi/server-api
    package: https://www.npmjs.com/package/@asyncapi/server-api
    detail: >-
      Run the whole API locally when you do not want to send documents to a
      third-party host. This is the closest thing to a sandbox the project ships,
      and it is the FULL service, not a reduced one.
