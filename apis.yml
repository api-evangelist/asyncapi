- aid: asyncapi:asyncapi-server-api
  name: AsyncAPI Server API
  description: >-
    The AsyncAPI Server API is the only callable HTTP API the AsyncAPI Initiative
    operates. It exposes the official AsyncAPI toolchain — validate, parse,
    convert, generate, bundle and diff — over HTTP at https://api.asyncapi.com/v1,
    free, keyless and without signup. It is stateless: every operation takes an
    AsyncAPI (or OpenAPI 3.0) document in the request body and returns a derived
    document, diagnostics or service metadata. The same service is self-hostable
    via Docker or `asyncapi start api`.
  humanURL: https://api.asyncapi.com/v1/docs
