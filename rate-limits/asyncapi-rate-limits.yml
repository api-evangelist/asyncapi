provider: AsyncAPI
providerId: asyncapi
note: >-
  REPLACES a 2026-05-04 scaffold that asserted free/professional/enterprise tiers
  with invented per-minute and per-month numbers. AsyncAPI publishes no rate
  limits at all. Two live unauthenticated calls (GET /v1/help, POST /v1/validate)
  both returned 200 and carried NO RateLimit-*, X-RateLimit-* or Retry-After
  header — the full response header set was security headers, etag, cache-control
  and Cloudflare/DigitalOcean routing headers. An honest zero is the finding: an
  agent gets no runtime budget signal from this API and must treat throttling as
  unannounced.
