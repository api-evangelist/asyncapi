note: >-
  The AsyncAPI Server API defines a single reusable `Problem` schema whose fields
  are exactly RFC 7807 / RFC 9457 Problem Details — type (URI), title, status,
  detail, instance, additionalProperties true, with type/title/status required.
  It is served as `application/json`, NOT `application/problem+json`, so the
  contract is problem-details-SHAPED but not media-type conformant. The spec
  publishes no per-code error registry — there is no catalogue of `type` URIs —
  so the entries below are the status-code surface derived from the operations,
  not an invented code list. The one example `type` URI the spec ships is
  https://api.asyncapi.com/problem/invalid-template-parameters.
